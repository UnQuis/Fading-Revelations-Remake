import javax.imageio.*;
import javax.imageio.stream.*;
import java.awt.image.*;
import java.io.*;

plugins {
    id "java"
}

version = "2.5.0"
sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenLocal()
    mavenCentral()
    //maven { url "https://raw.githubusercontent.com/Anuken/MavenRepositories/master/repository" }
    maven { url "https://jitpack.io" }
    maven { url "https://mirror.yandex.ru/mirrors/maven2/" }
}

ext {
    mindustryVersion = "v159.7"
    arcVersion = "v159.7"
}

configurations.all {
    resolutionStrategy {
        force "com.github.Anuken.Arc:arc-core:$arcVersion"
        force "com.github.Anuken.Arc:flabel:$arcVersion"
        force "com.github.Anuken.Arc:freetype:$arcVersion"
        force "com.github.Anuken.Arc:g3d:$arcVersion"
        force "com.github.Anuken.Arc:fx:$arcVersion"
        force "com.github.Anuken.Arc:arcnet:$arcVersion"
    }
}

allprojects {
    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.compilerArgs.addAll(["--release", "17"])
    }
}

dependencies {
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
}

def framesBuildDir = file("build/tmp/frames")

task convertGifFrames {
    description = "Convert .gif files in assets/sprites to individual frame .png files in build/tmp/frames"
    doLast {
        File assetsDir = file("assets")
        if (!assetsDir.exists()) return

        delete framesBuildDir

        fileTree(dir: assetsDir, include: "**/*.gif").each { gifFile ->
            println "Converting: ${gifFile.name}"
            try {
                ImageInputStream input = ImageIO.createImageInputStream(gifFile)
                Iterator<ImageReader> readers = ImageIO.getImageReaders(input)
                if (!readers.hasNext()) {
                    println "  No reader for: ${gifFile.name}"
                    input.close()
                    return
                }
                ImageReader reader = readers.next()
                reader.setInput(input)

                int frameCount = reader.getNumImages(true)
                println "  Frames: $frameCount"

                String baseName = gifFile.name[0..gifFile.name.toLowerCase().lastIndexOf(".gif")-1]

                String relativeDir = assetsDir.toPath().relativize(gifFile.parentFile.toPath()).toString()
                File outDir = new File(framesBuildDir, relativeDir)
                outDir.mkdirs()

                for (int i = 0; i < frameCount; i++) {
                    BufferedImage frame = reader.read(i)
                    File outFile = new File(outDir, "${baseName}${i}.png")
                    ImageIO.write(frame, "png", outFile)
                    println "    -> ${outFile.name}"
                }

                reader.dispose()
                input.close()
            } catch (Exception e) {
                println "  Error: ${e.message}"
            }
        }
    }
}

clean {
    delete framesBuildDir
}

tasks.named("jar") {
    dependsOn convertGifFrames
}

jar {
    archiveFileName = "FadingRevelations.jar"
    from sourceSets.main.output
    from files("mod.hjson")
    from(fileTree("assets")) {
        exclude "**/*.gif"
    }
    from fileTree(framesBuildDir)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// --- Локальный запуск клиента для тестирования ---

def runDir = file("run")
def clientFile = new File(runDir, "client-${mindustryVersion}.jar")

tasks.register("downloadClient") {
    group = "mindustry"
    description = "Download the Mindustry client jar into run/ (skipped if already present)"
    outputs.file(clientFile)
    onlyIf { !clientFile.exists() }
    doLast {
        runDir.mkdirs()
        String url = "https://github.com/Anuken/Mindustry/releases/download/${mindustryVersion}/Mindustry.jar"
        println "Downloading Mindustry ${mindustryVersion} -> ${clientFile}"
        URLConnection connection = new URL(url).openConnection()
        long contentLength = connection.contentLengthLong
        InputStream input = connection.getInputStream()
        FileOutputStream output = new FileOutputStream(clientFile)
        byte[] buffer = new byte[8192]
        long totalRead = 0
        int bytesRead
        int prevPercent = -1
        while ((bytesRead = input.read(buffer)) != -1) {
            output.write(buffer, 0, bytesRead)
            totalRead += bytesRead
            if (contentLength > 0) {
                int percent = (int) ((totalRead * 100) / contentLength)
                if (percent != prevPercent) {
                    print "\r> Downloading: ${percent}%"
                    System.out.flush()
                    prevPercent = percent
                }
            }
        }
        input.close()
        output.close()
        println "\nSaved to '${clientFile}'"
    }
}

tasks.register("installMod", DefaultTask) {
    group = "mindustry"
    description = "Copy the built mod jar into run/mods/"
    dependsOn jar
    inputs.file(jar.archiveFile)
    outputs.dir(new File(runDir, "mods"))
    doLast {
        File modsDir = new File(runDir, "mods")
        modsDir.mkdirs()
        File dest = new File(modsDir, jar.archiveFileName.get())
        if (dest.exists()) dest.delete()
        java.nio.file.Files.copy(jar.archiveFile.get().asFile.toPath(), dest.toPath())
        println "Copied '${dest.name}' to '${modsDir}'"
    }
}

tasks.register("runClient", JavaExec) {
    group = "mindustry"
    description = "Run Mindustry client with the mod installed (isolated data dir in run/)"
    dependsOn downloadClient, installMod
    workingDir = runDir
    classpath = files(clientFile)
    mainClass = "mindustry.desktop.DesktopLauncher"
    jvmArgs "-Xmx2g", "-Dfile.encoding=UTF-8"
    environment "MINDUSTRY_DATA_DIR", runDir.absolutePath
    environment "DEVELOPMENT", "true"
}
