block.enhanced-pyratite-mixer.name = Усовершенствованная мешалка пиротита
block.enhanced-pyratite-mixer.description = Усовершенствованная мешалка. Сильно нагревается при работе поэтому используется графит для изоляции.

block.esterification-chamber.name = Камера эстерификации
