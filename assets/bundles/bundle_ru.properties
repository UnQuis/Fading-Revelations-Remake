block.living-steel-liquifying-forge.description = Ожижает большее количество стали используя то же количество ресурсов что и его предыдущая версия.

#turrets

#item turrets

block.accel.name = Аксель
block.accel.description = Помечает цель высокоточным лазером перед выстрелом расширяющейся электрической пулей которая взрывается при контакте. Маркировочный лазер так же наносит урон при попадании.

block.big-swarmer.name = Атакующий
block.big-swarmer.description = Улучшенная версия Роевика. Наносит больше урона и стреляет быстрее.

block.caats.name = ПТСЦ
block.caats.description = Название даже мило не звучит хотя оно должно было. Это самое гордое противовоздушное изобретение Церберо: Противовоздушная Турельная Система Церберо.

block.corrupted-cyclone.name = Шторм
block.corrupted-cyclone.description = Улучшенная версия Циклона.

block.gattling.name = Пулемет Гатлинга
block.gattling.description = Скорострельная турель, способная вести огонь различными типами боеприпасов. Удачи в обеспечении его боеприпасами.

block.interitus.name = Интеритус
block.interitus.description = Эта большая турель сделана для уничтожения летающих врагов с помощью самонаводящихся ракет. Может использовать Пластан, Кинетический сплав и Фазовую ткань.

block.mine-launcher.name = Миномет
block.mine-launcher.description = Турель средних размеров которая запускает наземные мины, они остаются на земле до 12 секунд.

block.missile-battery.name = Ракетная Батарея
block.missile-battery.description = Выпускает балистических дронов которые стреляют шквалом самонаводящихся ракет. Не может разворачиватся пока заряжается.

block.missile-silo.name = Пусковая шахта ядерных боеголовок
block.missile-silo.description = Очень долго перезаряжается, но стреляет чрезвычайно мощными ядерными боеголовками, которые могут уничтожить почти любую наземную единицу одним попаданием. Имеет огромный радиус действия, но шахта очень хрупкая, поэтому позаботьтесь о ее защите. При попадании ядерная боеголовка также подавляет эффект регенераторов на некоторое время.

block.mortar.json.name = Мортира
block.mortar.json.description = Использует энергию и споровые стручки чтобы стрелять горящими снарядами во врагов на средней дистанции. Поджигает землю и поражает врагов при ударе в течение некоторого времени.

block.ore-turret.name = Предметометатель
block.ore-turret.description = Запускает сырые куски руды / материалов во врагов.

block.ring-turret.name = Т.К.Б
block.ring-turret.description = Турель с кассетными бомбами. Стреляет кассетной бомбой не наносит большой урон но покрывает большую площадь. Лучше не ставить слишком много а то начнет лагать.

block.sear.name = Выжигатель
block.sear.description = Улучшенная версия обжигателя. Сжигает врагов с большим радиусом и уроном.

block.shotgun.name = Дробовик
block.shotgun.description = Чем ближе враги к дулу тем больше урона они получат.

block.sniper.name = Снайпер
block.sniper.description = Турель точечной защиты с большим радиусом действия и высоким уроном.

block.sunflare.name = Солнечный луч
block.sunflare.description = Улучшенная версия выжигателя. Выпускает большое количество огня которое сжигает все на своем пути.

block.trio.name = Тройная турель
block.trio.description = Улучшенная версия двойной турели. Стреляет во врагов из трех вместо двух стволов сразу.


#liquid turrets

block.batter.name = Отталкиватель
block.batter.description = Выстреливает большие сгустки жидкости который отталкивает врагов или накладывают на них какие-то эффекты.

#power turrets

block.air-arc.name = Воздушная дуга
block.air-arc.description = Дуга которая атакует только летающих врагов.

block.big-arc.name = Штормовая дуга
block.big-arc.description = Дуга но с большим радиусом атаки и более быстрой стрельбой.

block.big-parallax.name = Дерацинация
block.big-parallax.description = Улучшенная версия Параллакса. Притягивает врагов быстрее и в процессе наносит больше урона.

block.big-scatter.name = Осколочный рассеиватель
block.big-scatter.description = Улучшенная версия Рассеивателя.

block.big-segment.name = Фрагмент
block.big-segment.description = Улучшенная версия Сегмента. Стреляет быстрее и наносит больше урона. Все еще не может нацелится на лазеры.

block.cavalry.name = Тяжелая Кавалерия
block.cavalry.description = Последняя турель в семье Копейщика. Имеет низкую скорость стрельбы но экстримально большой урон который затмевает даже легендарного Испепелителя.

block.kugelblitz.name = Шаровая молния
block.kugelblitz.description = Сильно заряжает электропроводящие металлы используя очень высокую мощность, создавая мощную сферу которая выплевывает молнии, уничтожая все на своем пути.

block.mega-meltdown.name = Армагедон
block.mega-meltdown.description = Улучшенная версия Испепелителя. Наносит тонны урона. Требует жидкость для стрельбы.

block.status-wave.name = Стазис-поле
block.status-wave.description = Испускает шоковые волны которые наносят урон и шокируют вражиские юниты, шокирование сильно замедляет юниты.

block.uhlan.name = Улан
block.uhlan.description = Улучшенная версия копейщика. Требует меньше времени для зарядки наносит больше урона и имеет больший радиус.

block.absole.name = Абсоль
block.absole.description = Мощная турель которая стреляет разрывными электрическими снарядами, кучей молний и самонаводящимися электрическими ракетами.

