block.amalgam-smelter.description = Смешивает медь, живую сталь и фазовую ткань для получения Стального Амальгама используя шлак как источник тепла.

block.amalgam-forge.name = Кузня Амальгама
block.amalgam-forge.description = Смешивает медь, живую сталь и фазовую ткань для получения Стального Амальгама используя шлак как источник тепла. Выплавляет амальгам быстрее плавильни.

block.uraniumrod-crafter.name = Изготовитель Урановых стержней
block.uraniumrod-crafter.description = Создает урановые стержни из тория, пластана и свинца.

