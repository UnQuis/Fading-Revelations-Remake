#precursor lore
fr.lore.archive.title = Архив Предтеч
fr.lore.recovered = Запись архива восстановлена
fr.lore.recovered-count = Записей
fr.lore.finale-locked = Последние записи откроются, когда все планетные архивы будут восстановлены.
fr.lore.chain.cangirus = Записи Кангируса
fr.lore.chain.hathor = Записи Хатор
fr.lore.chain.cerbero = Записи Церебро
fr.lore.chain.finale = Схождение
block.precursor-terminal.name = Терминал Предтеч
block.precursor-terminal.description = Древний терминал данных Предтеч. Нажатие восстанавливает очередной фрагмент их записей. Все фрагменты сохраняются в архиве и доступны для перечитывания на любом терминале.
fr.lore.c1-first-contact.title = Первый контакт
fr.lore.c1-first-contact.text = Экспедиция Осколков достигает Кангируса. Сканеры фиксируют действующие сооружения — автоматизированные базы, работающие дольше, чем кто-либо способен подсчитать. Системы немедленно определяют экспедицию как враждебную. Какому бы протоколу они ни следовали, он старше нас на тысячелетия.
fr.lore.c2-old-protocols.title = Старые протоколы
fr.lore.c2-old-protocols.text = Базы продолжают выполнять старые приказы. Они не понимают — или не желают понимать, — что их создателей больше нет. Каждое сооружение, каждая турель, каждый юнит — послание из войны, которая закончилась для всех, кроме машин, всё ещё её ведущих.
fr.lore.c3-betrayal.title = Предательство
fr.lore.c3-betrayal.text = Восстановленные архивы складывают первую версию раскола. Согласно данным Кангируса, одна из сторон Предтеч совершила предательство. Именно оно раскололо единую фракцию, а последовавшая война стёрла создателей из истории.
fr.lore.c4-culprit.title = Виновник
fr.lore.c4-culprit.text = Для Осколков картина выглядит просто: есть виновник, есть его наследие, и задача экспедиции — уничтожить его. Командование помечает операцию как зачистку: последняя война Предтеч будет закончена чужими руками.
fr.lore.c5-inconsistencies.title = Несоответствия
fr.lore.c5-inconsistencies.text = Часть найденных данных не совпадает с версией о предательстве. Временные метки не сходятся. Фрагменты упоминают проект, о котором не говорит ни один архив Кангируса. Аналитики помечают несоответствия и идут дальше — войну нужно закончить.
fr.lore.h1-silence.title = Тишина
fr.lore.h1-silence.text = Хатор почти стёрта. Руины и пепел — вот всё, что осталось от луны. Ни действующих систем, ни сопротивления. Только остовы сооружений, погибших задолго до того, как Осколки научились летать.
fr.lore.h2-other-side.title = Другая сторона
fr.lore.h2-other-side.text = Среди обломков Осколки находят уцелевшие записи — они принадлежат другой стороне конфликта. Не истории предателей. Истории обвиняемых. Они рисуют совершенно иную картину.
fr.lore.h3-no-betrayal.title = Не было предательства
fr.lore.h3-no-betrayal.text = Согласно Хатор, предательства не было. Одна сторона Предтеч пыталась предотвратить катастрофу. Другая продолжала действия, которые могли к ней привести. То, что Кангирус называет предательством, Хатор называет попыткой спасти Предтечей.
fr.lore.h4-project.title = Проект
fr.lore.h4-project.text = Технологии, которые в архивах Кангируса выглядели оружием, здесь оказываются частями единого неизвестного проекта. Обе версии убедительны. Обе не могут быть правдой одновременно. Экспедиция больше не знает, чьё наследие она пришла уничтожать.
fr.lore.r1-dead-world.title = Мёртвый мир
fr.lore.r1-dead-world.text = Церебро практически полностью мёртв. Здесь не сохранилось систем, способных рассказать Осколкам о произошедшем, — только руины и записи настолько старые, что большинство рассыпается от прикосновения.
fr.lore.r2-before-the-split.title = До раскола
fr.lore.r2-before-the-split.text = Старейшие записи не пытаются оправдать никого. Они описывают события, произошедшие ещё до самого раскола. Читая их, Осколки понимают: настоящий конфликт начался не с политического раскола Предтечей.
fr.lore.r3-discovery.title = Открытие
fr.lore.r3-discovery.text = Предтечи обнаружили — или создали — нечто. Технологию, ставшую причиной их разделения. Одна часть Предтеч хотела уничтожить её. Другая была уверена, что её можно контролировать. Из этого несогласия вырос конфликт, расколавший цивилизацию.
fr.lore.r4-weapon.title = Оружие
fr.lore.r4-weapon.text = После начала противостояния обе стороны обратили свои творения друг против друга. То, что стало причиной войны, постепенно превратилось в её оружие. Предтечи исчезли — но их системы так и не получили приказа остановиться.
fr.lore.f1-three-lines.title = Три линии
fr.lore.f1-three-lines.text = Кангирус говорит о предательстве. Хатор — о спасении. Церебро — о том, что было до них. Версии противоречат друг другу, потому что каждая сторона видела лишь часть произошедшего: одна — события до определённого момента, другая — после, третья — то, что к нему привело. Вместе они восстанавливают настоящую историю.
fr.lore.f2-last-enemy.title = Последний враг
fr.lore.f2-last-enemy.text = Предтечей больше нет. Раскола больше нет. Война, которую они вели, закончилась для всех, кроме машин, не получивших приказа остановиться. Осколки отправились закончить чужую войну — и нашли систему, которая всё ещё верит, что война продолжается. Настоящая цель экспедиции — не победа. Настоящая цель — тишина.

