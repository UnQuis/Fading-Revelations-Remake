block.steel-reactor.description = Использует высоковоспламеняемый Стальной амальгам чтобы вырабатывать большое количество энергии.

block.tiny-thermal-gen.name = Маленький термальный генератор
block.tiny-thermal-gen.description = Вырабатывает энергию, когда размещен в горячих местах.

block.turbine-concentrator.name = Турбинный концентратор
block.turbine-concentrator.description = Похож на Турбынный конденсатор но производит больше энергии и воды


