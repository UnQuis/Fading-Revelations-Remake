block.mini-od.description = Маленький сверхприводный проектор. Заставляет все в его радиусе работать быстрее но будте осторожны это повысит потребление электроэнергии!

block.outpost.name = Аванпост
block.outpost.description = Аванпост может быть построен где угодно на карте и он может передать все входящие в него предметы напрямую в ядро.

