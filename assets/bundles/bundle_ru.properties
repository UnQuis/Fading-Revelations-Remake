block.induced-kiln.description = Улучшенная печь которая более эффективна.

block.inverted-pulverizer.name = Инвертированный измельчитель
block.inverted-pulverizer.description = Превращяет песок в металолом. Не спрашивай как тебе нужно волноваться на счет того насколько это полезно.

block.phase-manufacturer.name = Производитель фазовой ткани
block.phase-manufacturer.description = Улучшенный фазовый синтезатор который работает более эффективно.

