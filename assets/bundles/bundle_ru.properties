block.overdrive-hive.description = Вершина технологий овердрайва. Сверхзаряжает все постройки в огромном радиусе и разгоняет все дружественные юниты, попадающие в его поле, делая их быстрее, выносливее и смертоноснее. Усильте Нано-Тканью, чтобы расширить оба радиуса.

fr.stat.overdrivehive = Также разгоняет всех дружественных юнитов в радиусе

