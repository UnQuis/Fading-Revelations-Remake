#jump gate & orbital ring project
block.jump-gate.name = Прыжковые ворота
block.jump-gate.description = Парный телепорт для юнитов. Свяжите двое ворот: юниты, вошедшие в эти ворота, мгновенно перемещаются к месту назначения. Каждая связь односторонняя — постройте обратную для двустороннего путешествия. Не перемещает морских юнитов. Требует энергии.
block.orbital-ring-station.name = Станция орбитального кольца
block.orbital-ring-station.description = Пусковой комплекс проекта «Орбитальное кольцо Кангируса». Может строиться только на Кангирусе. Загружайте в него ресурсы, необходимые текущему этапу строительства — прогресс общий для всей планеты. Каждый завершённый этап достраивает ещё один квадрант кольца вокруг Кангируса и даёт постоянный бонус в кампании.
status.jump-sickness.name = Фазовая усталость
status.jump-sickness.description = Этот юнит только что прыгнул через ворота и пока не может прыгнуть снова.
fr.ring.progress = Кольцо
fr.ring.complete = Орбитальное кольцо достроено
fr.ring.wrong-planet = Только на Кангирусе
fr.ring.stage-complete = Этап орбитального кольца завершён
fr.ring.stage.1 = Этап 1: Каркас
fr.ring.stage.2 = Этап 2: Обшивка
fr.ring.stage.3 = Этап 3: Жилое кольцо
fr.ring.stage.4 = Этап 4: Полное кольцо
