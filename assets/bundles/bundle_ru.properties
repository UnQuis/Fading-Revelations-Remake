block.basic-reassembly-chamber.description = Улучшает юнитов, созданных в Базовой Фабрике, на следуйщий уровень. Юниты полученные из этой Камеры могут быть дальше улучшенны.

block.primary-factory.name = Базовая Фабрика 
block.primary-factory.description = Создает маленьких и легких юнитов которых потом можно улучшить через Реконструкционные камеры.

block.progressive-reassembly-chamber.name = Прогрессивная Реконструкционная Камера
