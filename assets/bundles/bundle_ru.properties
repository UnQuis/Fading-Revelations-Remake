#cerberian

unit.cerberian-penumbra.name = Полутень
unit.cerberian-penumbra.description = Юнит схожий по строению с Затемью из Серпуло но стреляет лазером а не обычными снарядами из главных орудий.

unit.cerberian-curtulus.name = Куртулус
unit.cerberian-curtulus.description = Юнит похожий на Аркид но вместо того чтобы стрелять артилерийскими снарядами из главного орудия, оно стреляет жидкими снарядами.

unit.cerberian-hexathelid.name = Гексателид
unit.cerberian-hexathelid.description = Юнит похожий на Атракса но он стреляет разрывными сферами шлака. Разменял свою броню и хп ради большего урона.

unit.cerberian-behemoth.name = Цеберианский Бегемот
unit.cerberian-behemoth.description = Огромный юнит и самое гордое изобретение Цеберо.

unit.cerberian-straggle.name = Страггл
unit.cerberian-straggle.description = Цеберианская версия Ползуна.

unit.cerberian-bayonet.name = Штык
unit.cerberian-bayonet.description = Усиленная версия Кинжала которого можно найти на Серпуло.

unit.cerberian-veil.name = Завеса
unit.cerberian-veil.description = Этот юнит похож на Затмение но он стреляет не разрывными снарядами а энергетическими ракетами. Так же стреляет более сильным лазером. Пожертвовали небольшим количеством броней ради хп и урона.

unit.cerberian-spark.name = Искра
unit.cerberian-spark.description = Юнит похожий на Вспышку но с улучшенным оружием.

unit.cerberian-citadel.name = Цитадель
unit.cerberian-citadel.description = Улучшенная версия Крепости которая была созданна на Цеберо.

unit.cerberian-vista.name = Виста
unit.cerberian-vista.description = Юнит, похожий на Горизонт, который кидает усиленные бомбы. 

unit.cerberian-cudgel.name = Дубина
unit.cerberian-cudgel.description = Юнит похожий на Булаву из Серпуло но сильнее. Использует другой вид огнемета.

unit.cerberian-kaiser.name = Кайзер
unit.cerberian-kaiser.description = Юнит вдохновленный Властью из Серпуло но с улучшенными технологиями. Сильно увеличенное хп и броня но пришлось пожертвовать мобильностью.

unit.cerberian-baton.name = Жезл
unit.cerberian-baton.description = Переделанная версия Скипетра.

unit.cerberian-nephila.name = Нефила
unit.cerberian-nephila.description = Как и Спайрокт крадет хп у врагов но делает это гораздо лучше с помощью своих усиленных лазеров.

unit.cerberian-setosus.name = Сетосус
unit.cerberian-setosus.description = Похож на Токсопида. Его второстепенное оружие стреляет жизнепоглощяющими лазерами вместо обычных. Обладает значительно большей броней и силой атаки, чем обычный токсопид.

unit.cerberian-summit.name = Саммит
unit.cerberian-summit.description = Юнит похожий на Зенит но он стреляет шквалом ракет вместо одной ракеты за выстрел.

#core units

unit.delta.name = [orange]Дельта
unit.delta.description = Защищает ядро Атом от врагов. Может быстро возводить структуры.

unit.epsilon.name = [orange]Эпислон
unit.epsilon.description = Защищает ядро Элемент от врагов. Может быстро возводить структуры.

#mothership

unit.altaic.name = [green]Алтайка
unit.altaic.description = Большой Морской юнит поддержки оснащен несколькими видами оружия для лечения и точечной защиты. Спавнит Оксино. Наносит урон и замедляет врагов с помощью энергетического поля. Так же это поле может лечить союзных юнитов и постройки.

unit.corax.name = [green]Коракс
unit.corax.description = Тяжелый юнит который похож на Ворона. Выпускает тот же лазер что и Ворон но так же имеет немного легкой артиллерии.

unit.toruct.name = [purple]Торук
unit.toruct.description = Вооружен уменьшеной версией зажигательного лазера Ликозида, этот юнит может поджигать свои цели.

unit.reduct.name = [purple]Сопротивление
unit.reduct.description = Вооружен уменьшеной версией замораживающего лазера Ликозида, этот юнит может замораживать свои цели.

unit.hive-attack.name = [purple] Тяжелая Штурмовая Единица РОЯ
unit.hive-attack.description = Его спавнит РОЙ и он экипирован специальными сенсорами которые позволяют держать идеальную дистанцию до цели, этот дрон атакует ваших врагов самым оптимальным путем.

unit.hive.name = [orange]РОЙ
unit.hive.description = Массивный корабль который производит атакующих юнитов. Сам по себе хрупкий но его очень прочный силовой купол может выдержать 20900 урона прежде чем сломаться. Внимание! когда купол сломается 9100 прочности РОЯ находятся под прямым огнем!

unit.japonica.name = [orange]Японика
unit.japonica.description = Огромный Морской юнит который оснащен самым различным вооружением и умениями.

unit.sps-strahl.name = [orange]Орбитальная Платформа Штраль
unit.sps-strahl.description = Орбитальная платформа штраль один из самых засекреченных проектов которые когда либо были созданы, Этот юнит отличается своим разрушительным потенциалом и смертельным радиусом поражения ни разу не упоминался в каких либо записях, в то время как технологии, которые, как представляется, были разработаны для Штраль внедрялись военными по всему кластеру только некоторые знали что он и правда существовал еще меньше встретили его вживую и те некоторые которые встречали его не выживали. Хоть он и летает но он настолько тяжелый что он не может летать над водой без боязни быть уничтоженным.

unit.lycosid.name = [purple]Ликозид
unit.lycosid.description = Медленный но сильный паукоподобный юнит экипирован сверхсмертоносным оружием!

