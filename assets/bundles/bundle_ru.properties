block.powderizer.description = Улучшенная и увеличенная версия Измельчителя.

block.silicon-arc-forge.name = Кремниевая дуговая кузница
block.silicon-arc-forge.description = Улучшенная версия кремнеивой дуговой печи которая производит кремний более эффективно.

block.silicon-forge.name = Кремниевая кузница
block.silicon-forge.description = Улучшенная кремниевая плавильня которая работает эффективнее.

block.small-heat-router.name = Уменьшенный тепловой маршрутизатор
block.small-heat-router.description = Уменьшенный тепловой маршрутизатор который занимает меньше места!

block.spore-crusher.name = Споровый дробитель
block.spore-crusher.description = Производит нефть разрушая споровые стручки.

block.surge-melter.name = Плавильня кинетического сплава
block.surge-melter.description = Улучшенная версия тигеля кинетического сплава которая работает эффективнее.

block.surge-oven-big.name = Кузня кинетического сплава
block.surge-oven-big.description = Улучшенная плавильня которая работает эффективнее.

block.basic-multismelter.name = Базовая Мультиплавильня
block.basic-multismelter.description = Использует уголь, песок и свинец чтобы создать 3 материала сразу Метастекло, Графит и Кремний.

block.neutron-blender.name = Нейтронный смешиватель
block.neutron-blender.description = Смешивает большое количество Криогенной жидкости, Нефти и Живой жидкой стали в сильнодействующую Нейтронную жидкость.

