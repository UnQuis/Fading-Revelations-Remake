#precursor lore
fr.lore.archive.title = Archiv der Vorfahren
fr.lore.recovered = Archiv-Eintrag wiederhergestellt
fr.lore.recovered-count = Einträge
fr.lore.finale-locked = Die letzten Aufzeichnungen werden freigeschaltet, wenn alle Planetenarchive wiederhergestellt sind.
fr.lore.chain.cangirus = Cangirus-Aufzeichnungen
fr.lore.chain.hathor = Hathor-Aufzeichnungen
fr.lore.chain.cerbero = Cerbero-Aufzeichnungen
fr.lore.chain.finale = Die Zusammenführung
block.fading-revelations-remake-precursor-terminal.name = Terminal der Vorfahren
block.fading-revelations-remake-precursor-terminal.description = Ein uraltes Datenterminal der Vorfahren. Ein Antippen stellt ein weiteres Fragment ihrer Aufzeichnungen wieder her. Jedes Fragment wird im Archiv gespeichert und kann an jedem Terminal erneut gelesen werden.
fr.lore.c1-first-contact.title = Erster Kontakt
fr.lore.c1-first-contact.text = Die Expedition der Splitter erreicht Cangirus. Die Scanner erfassen aktive Anlagen - automatisierte Basen, die länger laufen, als irgendjemand berechnen kann. Die Systeme stufen die Expedition sofort als feindlich ein. Welchem Protokoll sie auch folgen, er ist älter als wir um Jahrtausende.
fr.lore.c2-old-protocols.title = Alte Protokolle
fr.lore.c2-old-protocols.text = Die Basen führen weiter alte Befehle aus. Sie verstehen nicht - oder wollen nicht verstehen -, dass ihre Schöpfer fort sind. Jede Struktur, jeder Turm, jede Einheit ist eine Botschaft aus einem Krieg, der für alle endete - außer für die Maschinen, die ihn noch führen.
fr.lore.c3-betrayal.title = Der Verrat
fr.lore.c3-betrayal.text = Wiederhergestellte Archive rekonstruieren die erste Version des Schismas. Den Daten von Cangirus zufolge beging eine Seite der Vorfahren Verrat. Genau dieser Verrat spaltete die eine Fraktion, und der folgende Krieg löschte ihre Schöpfer aus der Geschichte.
fr.lore.c4-culprit.title = Der Schuldige
fr.lore.c4-culprit.text = Für die Splitter sieht das Bild einfach aus: Es gibt einen Schuldigen, es gibt sein Erbe, und es ist Aufgabe der Expedition, es zu vernichten. Das Kommando führt die Operation als Säuberung - der letzte Krieg der Vorfahren wird von fremden Händen beendet.
fr.lore.c5-inconsistencies.title = Widersprüche
fr.lore.c5-inconsistencies.text = Ein Teil der gefundenen Daten passt nicht zur Verratsthese. Zeitstempel stimmen nicht. Fragmente erwähnen ein Projekt, von dem kein Cangirus-Archiv spricht. Die Analysten markieren die Widersprüche und gehen weiter - es gilt, einen Krieg zu beenden.
fr.lore.h1-silence.title = Stille
fr.lore.h1-silence.text = Hathor ist fast ausgelöscht. Ruinen und Asche - das ist alles, was vom Mond übrig ist. Keine aktiven Systeme, kein Widerstand. Nur die Überreste von Bauwerken, die starben, lange bevor die Splitter fliegen lernten.
fr.lore.h2-other-side.title = Die andere Seite
fr.lore.h2-other-side.text = Im Trümmerfeld finden die Splitter intakte Aufzeichnungen - geschrieben von der anderen Seite des Konflikts. Nicht die Geschichte der Verräter. Die Geschichte der Angeklagten. Sie zeichnet ein völlig anderes Bild.
fr.lore.h3-no-betrayal.title = Kein Verrat
fr.lore.h3-no-betrayal.text = Hathor zufolge gab es keinen Verrat. Eine Seite der Vorfahren versuchte, eine Katastrophe zu verhindern. Die andere fuhr mit Handlungen fort, die sie herbeiführen würden. Was Cangirus Verrat nennt, nennt Hathor den Versuch, die Vorfahren zu retten.
fr.lore.h4-project.title = Das Projekt
fr.lore.h4-project.text = Technologien, die in den Cangirus-Archiven wie Waffen aussahen, erweisen sich hier als Teile eines einzigen unbekannten Projekts. Beide Versionen sind überzeugend. Beide können nicht wahr sein. Die Expedition weiß nicht mehr, wessen Erbe sie vernichten soll.
fr.lore.r1-dead-world.title = Die tote Welt
fr.lore.r1-dead-world.text = Cerbero ist fast vollständig tot. Keine Systeme haben hier überlebt, um den Splittern zu erzählen, was geschah - nur Ruinen und Aufzeichnungen, so alt, dass die meisten bei einer Berührung zerfallen.
fr.lore.r2-before-the-split.title = Vor dem Schisma
fr.lore.r2-before-the-split.text = Die ältesten Aufzeichnungen versuchen niemanden zu rechtfertigen. Sie beschreiben Ereignisse von vor dem Schisma selbst. Beim Lesen begreifen die Splitter: Der wahre Konflikt begann nicht mit der politischen Spaltung der Vorfahren.
fr.lore.r3-discovery.title = Die Entdeckung
fr.lore.r3-discovery.text = Die Vorfahren fanden - oder erschufen - etwas. Eine Technologie, die zur Ursache ihrer Teilung wurde. Ein Teil der Vorfahren wollte sie vernichten. Der andere war sicher, sie ließe sich kontrollieren. Aus dieser Meinungsverschiedenheit wuchs der Konflikt, der eine Zivilisation spaltete.
fr.lore.r4-weapon.title = Die Waffe
fr.lore.r4-weapon.text = Nach Beginn der Auseinandersetzungen richteten beide Seiten ihre Schöpfungen gegeneinander. Was den Krieg verursacht hatte, wurde nach und nach zu seiner Waffe. Die Vorfahren verschwanden - doch ihre Systeme erhielten keinen Befehl, aufzuhören.
fr.lore.f1-three-lines.title = Drei Linien
fr.lore.f1-three-lines.text = Cangirus spricht von Verrat. Hathor spricht von Rettung. Cerbero spricht von dem, was beiden vorausging. Die Versionen widersprechen sich, weil jede Seite nur einen Teil des Geschehens sah: die eine - die Ereignisse bis zu einem bestimmten Moment, die andere - danach, die dritte - was dazu führte. Zusammen stellen sie die wahre Geschichte wieder her.
fr.lore.f2-last-enemy.title = Der letzte Feind
fr.lore.f2-last-enemy.text = Die Vorfahren sind fort. Der Schisma ist fort. Der Krieg, den sie führten, endete für alle - außer für die Maschinen, die nie den Befehl zum Aufhören erhielten. Die Splitter machten sich auf, den Krieg anderer zu beenden - und fanden ein System, das noch immer glaubt, er werde geführt. Das wahre Ziel der Expedition ist nicht der Sieg. Es ist die Stille.

