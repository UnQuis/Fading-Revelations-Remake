#other units

unit.fading-revelations-remake-onager.name = [orange]Onager
unit.fading-revelations-remake-onager.description = Ein riesiger Panzer ausgerüstet mit einem zielsuchenden Raketenwerfer und mehreren kleineren Waffen. Spezialisiert auf die Zerstörung von Gebäuden aber schwächer im Kampf gegen Einheiten.

unit.fading-revelations-remake-sambuca.name = [orange]Sambuca
unit.fading-revelations-remake-sambuca.description = Ein kleiner Panzer, ausgerüstet mit einer kleinen Waffe. Spezialisiert auf Gebäudezerstörung aber etwas schwächer gegen Einheiten.

unit.fading-revelations-remake-scorpio.name = [orange]Scorpio
unit.fading-revelations-remake-scorpio.description = Ein Panzer ausgerüstet mit einer Railgun. Spezialisiert auf Belagerungen. Schwächer gegen Einheiten.

unit.fading-revelations-remake-springald.name = [orange]Springald
unit.fading-revelations-remake-springald.description = Ein großer Panzer ausgerüstet mit einem Raketenwerffer und kleinen Lasereinheiten. Glänzt in Belagerungen aber ist etwas schwächer gegen Einheiten.

unit.fading-revelations-remake-aestiva.name = [green]Aestiva
unit.fading-revelations-remake-aestiva.description = Eine große naval-Supporteinheit ausgerüstet mit einer Heil-Shotgun. Erschafft Alba.

unit.fading-revelations-remake-alba.name = [green]Alba
unit.fading-revelations-remake-alba.description = Eine kleine naval-Supporteinheit, welche mit nichts außer einem kleinen Regenerationsprojektor ausgerüstet ist.

unit.fading-revelations-remake-annax.name = [purple]Annax
unit.fading-revelations-remake-annax.description = Eine kleine Bodeneinheit welche mithilfe von zwei Schlackegewehren großen Schaden verursachen kann.

unit.fading-revelations-remake-apis.name = [orange]Apis
unit.fading-revelations-remake-apis.description = Eine kleine, laserbasierte Angriffseinheit.

unit.fading-revelations-remake-arnux.name = [orange]Arnux
unit.fading-revelations-remake-arnux.description = Eine schwere Navaleinheit ausgerüstet mit hochmodernen Waffen welche EMPs verursachen können.

unit.fading-revelations-remake-arvens.name = [green]Arvens
unit.fading-revelations-remake-arvens.description = Eine mittelgroße naval-Supporteinheit, welche über keine Waffen verfügt aber einen Heilprojektor besitzt. Erhöht das Bautempo von Einheiten in der Nähe.

unit.fading-revelations-remake-auratus.name = [purple]Auratus
unit.fading-revelations-remake-auratus.description = Eine große Bodeneinheit, die Elementarwaffen nutzt, um hohen Schaden zu verursachen.

unit.fading-revelations-remake-close-range.name = [orange]Alopex
unit.fading-revelations-remake-close-range.description = Eine extrem schnelle Einheit mit hohem Schaden aber dafür mit sehr niedrigen Lebenspunkten.

unit.fading-revelations-remake-kestrel.name = [orange]Kestrel
unit.fading-revelations-remake-kestrel.description = Eine schnelle aber fragile Einheit mit starken offensiven Waffen.

unit.fading-revelations-remake-lancer-drone.name = [orange]Areus
unit.fading-revelations-remake-lancer-drone.description = Eine kleine Drohne, die mit 2 kleinen Lancern ausgestattet ist.

unit.fading-revelations-remake-plant.name = [green]Setzling
unit.fading-revelations-remake-plant.description = Eine große Supporteinheit, die darauf spezialisiert ist zu Bauen und zu Heilen.

unit.fading-revelations-remake-sapling.name = [green]Sprößling
unit.fading-revelations-remake-sapling.description = Eine mittelgroße Supporteinheit, die darauf spezialisiert ist zu Bauen und zu Heilen.

unit.fading-revelations-remake-seed.name = [green]Samen
unit.fading-revelations-remake-seed.description = Eine kleine Supporteinheit, die darauf spezialisiert ist zu Bauen und zu Heilen.

unit.fading-revelations-remake-mela.name = [orange]Mela
unit.fading-revelations-remake-mela.description = Eine kleine Einheit ausgerüstet mit einfacher Bewaffnung.

unit.fading-revelations-remake-scofra.name = [purple]Scofra
unit.fading-revelations-remake-scofra.description = Eine mittelgroße Bodeneinheit, welche Öl und Feuer nutzt, um viel Schaden zu verursachen.

unit.fading-revelations-remake-procer.name = [orange]Procer
unit.fading-revelations-remake-procer.description = Ein mittelgroße Einheit gemacht für den Angriff.

unit.fading-revelations-remake-ducalis.name = [orange]Ducalis
unit.fading-revelations-remake-ducalis.description = Eine große Angriffseinheit ausgerüstet mit Raketenwerfern und Lasern.

unit.fading-revelations-remake-cromis.name = [orange]Cromis
unit.fading-revelations-remake-cromis.description = Eine mittelgroße naval-Angriffseinheit, welche mit fortgerschrittener, EMP-auslösender Bewaffnung ausgestattet ist.


#mothership type

unit.fading-revelations-remake-sps-strahl.name = [orange]Orbitale Angriffsplattform STRAHL
unit.fading-revelations-remake-sps-strahl.description = Eine große Einheit ausgestattet mit mehreren Lasern, die Gegner einfrieren.

unit.fading-revelations-remake-japonica.name = [orange]Japonica
unit.fading-revelations-remake-japonica.description = Eine große Navaleinheit, die mit vielen verschiedenen Offensivwaffen ausgestattet ist und Eineiten erschaffen kann.

unit.fading-revelations-remake-corax.name = [green]Corax
unit.fading-revelations-remake-corax.description = Eine Einheit ähnlich der Corvus Einheit aber mit verbesserten Waffensystemen.

unit.fading-revelations-remake-hive.name = [orange]HIVE
unit.fading-revelations-remake-hive.description = Eine riesige Einheit ausgestattet mit mehreren Lasern, die Gegner verbrennen.

unit.fading-revelations-remake-lycosid.name = [purple]Lycosid
unit.fading-revelations-remake-lycosid.description = Eine Einheit, welche sehr gut gepanzert ist und mit Elementarwaffen sowie einer großen Energiewaffe kämpft. Erschafft elementare Einheiten.

unit.fading-revelations-remake-altaic.name = [green]Altaic
unit.fading-revelations-remake-altaic.description = Eine riesige Supporteinheit mit mehreren heilenden und kugel-abwehrenden Waffen. Erschafft Oxynoe. Beschädigt und verlangsamt Gegner mit einem Energiefeld. Dieses Energiefeld visiert auch freundliche Blöcke und Einheiten and und heilt sie.


#cerberian

unit.fading-revelations-remake-cerberian-penumbra.description = Eine Einheit mit Technologie ähnlich der einer Antumbra Einheit von Serpulo aber die Hauptkanone shießt einen Laser statt normalen Kugeln.

unit.fading-revelations-remake-cerberian-curtulus.description = Eine Einheit mit einem Aussehen ähnlich dem der Arkyid Einehit aber die Hauptkanone shießt anstatt Artilleriekugeln Flüssigkeitenkugeln.

unit.fading-revelations-remake-cerberian-hexathelid.description = Eine Einheit ähnlich dem Atrax aber shießt mit Schrot-Schlackenkugeln.

unit.fading-revelations-remake-cerberian-behemoth.description = Eine riesige Einheit und Cerberos stolzeste Erfindung. Shießt mit einem gewaltigen Laser, riesigen Splittergeshossen, Laserbarragen und kleineren FLAK-Geschützen.

unit.fading-revelations-remake-cerberian-straggle.description = Eine cerberianische Version der Crawler Einheit.

unit.fading-revelations-remake-cerberian-bayonet.description = Eine stärkere Version der Dagger Einheit, welche typischerweise auf Serpulo aufzufinden ist.

unit.fading-revelations-remake-cerberian-veil.description = Wie die Eclipse Einheit aber anstatt Flak shießt diese Einheit mit Rakteten. Schießt außerdem mit einem stärkeren Laser.

unit.fading-revelations-remake-cerberian-spark.description = Eine Einheit änhlich der Flare Einehit von Serpulo aber mit verbesserter Bewaffnung.

unit.fading-revelations-remake-cerberian-citadel.description = Eine verbesserte Version der Fortress Einehit, welche von Cerbero stammt.

unit.fading-revelations-remake-cerberian-vista.description = Eine Einheit wie die Horizon Einheit aber wirft stärkere Bomben ab.

unit.fading-revelations-remake-cerberian-cudgel.description = Eine Einheit änhlich der Mace Einehit von Serpulo aber stärker. Shießt mit einer anderen Art Flammenwerfer.

unit.fading-revelations-remake-cerberian-kaiser.description = Eine Einheit inspiriert von der Reign Einehit von Serpulo aber mit verbesserter Technologie.

unit.fading-revelations-remake-cerberian-baton.description = Eine neu hergestellte Version der Scepter Einheit.

unit.fading-revelations-remake-cerberian-nephila.description = Wie die Spiroct Einheit aber stiehlt mehr Leben mithilfe von verbesserten schächenden Lasern.

unit.fading-revelations-remake-cerberian-setosus.description = Eine Toxopid-ähnliche Einheit. Die Sekundärkanonen schießen schwächende, lebenstehlende Laser statt normalen.

unit.fading-revelations-remake-cerberian-summit.description = Eine Einheit änhlich der Zenith Einheit aber die Raketenwerfer feuern Raketenbarragen statt einzelnen Raketen.



