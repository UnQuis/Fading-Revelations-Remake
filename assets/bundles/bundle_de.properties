#jump gate & orbital ring project
block.fading-revelations-remake-jump-gate.name = Sprungtor
block.fading-revelations-remake-jump-gate.description = Ein paarweise verknüpfter Teleporter für Einheiten. Verknüpfe zwei Tore: Einheiten, die dieses Tor betreten, werden sofort zum Ziel bewegt. Jede Verknüpfung ist unidirektional - baue eine Rückverknüpfung für Reisen in beide Richtungen. Bewegt keine Marineeinheiten. Benötigt Strom.
block.fading-revelations-remake-orbital-ring-station.name = Orbitalring-Station
block.fading-revelations-remake-orbital-ring-station.description = Ein Startkomplex für das Cangirus-Orbitalring-Projekt. Nur auf Cangirus baubar. Füttere ihn mit den Ressourcen, die die aktuelle Bauphase verlangt - der Fortschritt wird auf dem gesamten Planeten geteilt. Jede abgeschlossene Phase fügt einen weiteren Quadranten zum Ring um Cangirus hinzu und gewährt einen dauerhaften Kampagnen-Bonus.
status.fading-revelations-remake-jump-sickness.name = Phasenmüdigkeit
status.fading-revelations-remake-jump-sickness.description = Diese Einheit ist gerade durch ein Tor gesprungen und kann noch nicht erneut springen.
