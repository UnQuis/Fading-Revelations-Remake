unit.fading-revelations-remake-hive-attack.description = Erschaffen vom HIVE Mutterschiff und ausgerüstet mit speziellen Sensoren, die es der Einheit erlauben, immer den perfekten Abstand zu Gegnern einzuhalten. Diese Drohne ist dafür gemacht, deine Gegner optimal anzugreifen.

