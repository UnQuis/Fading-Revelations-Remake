block.fading-revelations-remake-jump-gate.name = Portal de salto
block.fading-revelations-remake-jump-gate.description = Un teletransportador de unidades enlazado por pares. Enlaza dos portales: las unidades que entren en este portal se moverán al instante a su destino. Cada enlace es de una sola dirección: construye un enlace de vuelta para viajar en ambos sentidos. No mueve unidades navales. Requiere energía.
block.fading-revelations-remake-orbital-ring-station.name = Estación del Anillo Orbital
block.fading-revelations-remake-orbital-ring-station.description = Un complejo de lanzamiento para el proyecto del Anillo Orbital de Cangirus. Solo se puede construir en Cangirus. Aliméntala con los recursos que exige la fase de construcción actual: el progreso se comparte en todo el planeta. Cada fase completada añade otro cuadrante al anillo alrededor de Cangirus y otorga una bonificación permanente de campaña.
