#precursor lore
fr.lore.archive.title = Archivo de los Precursores
fr.lore.recovered = Entrada de archivo recuperada
fr.lore.recovered-count = Entradas
fr.lore.finale-locked = Los últimos registros se desbloquean cuando se recuperen todos los archivos de los planetas.
fr.lore.chain.cangirus = Registros de Cangirus
fr.lore.chain.hathor = Registros de Hathor
fr.lore.chain.cerbero = Registros de Cerbero
fr.lore.chain.finale = La convergencia
block.fading-revelations-remake-precursor-terminal.name = Terminal de los Precursores
block.fading-revelations-remake-precursor-terminal.description = Una terminal de datos antigua de los Precursores. Al tocarla se restaura otro fragmento de sus registros. Cada fragmento se guarda en el archivo y puede releerse en cualquier terminal.
fr.lore.c1-first-contact.title = Primer contacto
fr.lore.c1-first-contact.text = La expedición de los Fragmentos llega a Cangirus. Los escáneres detectan instalaciones activas: bases automatizadas que llevan funcionando más de lo que nadie puede calcular. Los sistemas identifican de inmediato a la expedición como una amenaza. Sea cual sea el protocolo que siguen, nos precede por milenios.
fr.lore.c2-old-protocols.title = Protocolos antiguos
fr.lore.c2-old-protocols.text = Las bases siguen ejecutando órdenes antiguas. No entienden - o se niegan a entender - que sus creadores ya no existen. Cada estructura, cada torreta, cada unidad es un mensaje de una guerra que terminó para todos menos para las máquinas que aún la libran.
fr.lore.c3-betrayal.title = La traición
fr.lore.c3-betrayal.text = Los archivos recuperados reconstruyen la primera versión de la escisión. Según los datos de Cangirus, uno de los bandos de los Precursores cometió traición. Esa traición destrozó la facción única, y la guerra que siguió borró a sus creadores de la historia.
fr.lore.c4-culprit.title = El culpable
fr.lore.c4-culprit.text = Para los Fragmentos, el panorama parece simple: hay un culpable, hay su legado, y la meta de la expedición es destruirlo. El mando marca la operación como una limpieza: la última guerra de los Precursores será terminada por manos ajenas.
fr.lore.c5-inconsistencies.title = Incoherencias
fr.lore.c5-inconsistencies.text = Parte de los datos recuperados no coincide con la versión de la traición. Las marcas de tiempo no cuadran. Algunos fragmentos mencionan un proyecto del que ningún archivo de Cangirus habla. Los analistas lo anotan y siguen adelante: hay una guerra que terminar.
fr.lore.h1-silence.title = Silencio
fr.lore.h1-silence.text = Hathor está casi borrada. Ruinas y ceniza: eso es todo lo que queda de la luna. Sin sistemas activos, sin resistencia. Solo los restos de estructuras que murieron mucho antes de que los Fragmentos aprendieran a volar.
fr.lore.h2-other-side.title = El otro bando
fr.lore.h2-other-side.text = Entre los escombros, los Fragmentos encuentran registros intactos: escritos por el otro bando del conflicto. No la historia de los traidores. La historia de los acusados. Pinta un cuadro completamente distinto.
fr.lore.h3-no-betrayal.title = No hubo traición
fr.lore.h3-no-betrayal.text = Según Hathor, no hubo traición. Un bando de los Precursores intentaba prevenir una catástrofe. El otro continuaba con acciones que podrían causarla. Lo que Cangirus llama traición, Hathor lo llama un intento de salvar a los Precursores.
fr.lore.h4-project.title = El proyecto
fr.lore.h4-project.text = Las tecnologías que en los archivos de Cangirus parecían armas aquí resultan ser partes de un único proyecto desconocido. Ambas versiones son convincentes. Ambas no pueden ser ciertas. La expedición ya no sabe de quién es el legado que vino a destruir.
fr.lore.r1-dead-world.title = El mundo muerto
fr.lore.r1-dead-world.text = Cerbero está casi completamente muerto. Aquí no sobreviven sistemas capaces de contar a los Fragmentos lo que ocurrió: solo ruinas y registros tan antiguos que la mayoría se desmorona al tocarlos.
fr.lore.r2-before-the-split.title = Antes de la escisión
fr.lore.r2-before-the-split.text = Los registros más antiguos no intentan justificar a nadie. Describen eventos anteriores a la propia escisión. Al leerlos, los Fragmentos comprenden: el conflicto real no comenzó con la fractura política de los Precursores.
fr.lore.r3-discovery.title = El descubrimiento
fr.lore.r3-discovery.text = Los Precursores encontraron - o crearon - algo. Una tecnología que se convirtió en la causa de su división. Una parte de los Precursores quería destruirla. La otra estaba segura de que podía controlarse. De ese desacuerdo creció el conflicto que partió una civilización.
fr.lore.r4-weapon.title = El arma
fr.lore.r4-weapon.text = Cuando empezaron los combates, ambos bandos volvieron sus creaciones uno contra el otro. Lo que había causado la guerra se convirtió gradualmente en su arma. Los Precursores desaparecieron, pero sus sistemas nunca recibieron la orden de detenerse.
fr.lore.f1-three-lines.title = Tres líneas
fr.lore.f1-three-lines.text = Cangirus habla de traición. Hathor habla de salvación. Cerbero habla de lo que vino antes que ambas. Las versiones se contradicen porque cada bando vio solo una parte de lo ocurrido: uno, los eventos hasta cierto momento; otro, lo que vino después; el tercero, lo que lo provocó. Juntas reconstruyen la historia verdadera.
fr.lore.f2-last-enemy.title = El último enemigo
fr.lore.f2-last-enemy.text = Los Precursores ya no existen. La escisión ya no existe. La guerra que libraron terminó para todos, salvo para las máquinas que nunca recibieron la orden de detenerse. Los Fragmentos salieron a terminar la guerra de otros - y encontraron un sistema que aún cree que se está librando. La verdadera meta de la expedición no es la victoria. Es el silencio.

