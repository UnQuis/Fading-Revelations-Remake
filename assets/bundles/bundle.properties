#jump gate & orbital ring project
block.jump-gate.name = Jump Gate
block.jump-gate.description = A pair-linked teleporter for units. Link two gates together: units entering this gate are instantly moved to its destination. Each link is one-way - build a link back for two-way travel. Does not move naval units. Requires power.
block.orbital-ring-station.name = Orbital Ring Station
block.orbital-ring-station.description = A launch complex for the Cangirus Orbital Ring project. Can only be built on Cangirus. Feed it the resources the current construction stage demands - progress is shared across the whole planet. Each completed stage adds another quadrant to the ring around Cangirus and grants a permanent campaign bonus.
status.jump-sickness.name = Phase Fatigue
status.jump-sickness.description = This unit just jumped through a gate and cannot jump again yet.
