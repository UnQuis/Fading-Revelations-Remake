#precursor lore
fr.lore.archive.title = Precursor Archive
fr.lore.recovered = Archive entry recovered
fr.lore.recovered-count = Entries
fr.lore.finale-locked = The last records unlock when all planet archives are recovered.
fr.lore.chain.cangirus = Cangirus Records
fr.lore.chain.hathor = Hathor Records
fr.lore.chain.cerbero = Cerbero Records
fr.lore.chain.finale = The Convergence
block.precursor-terminal.name = Precursor Terminal
block.precursor-terminal.description = An ancient data terminal of the Precursors. Tapping it restores another fragment of their records. Every fragment is stored in the archive and can be re-read at any terminal.
fr.lore.c1-first-contact.title = First Contact
fr.lore.c1-first-contact.text = The Shards' expedition reaches Cangirus. Scanners pick up active installations - automated bases that have been running for longer than anyone can calculate. The systems immediately identify the expedition as a hostile actor. Whatever protocol they follow, it predates us by millennia.
fr.lore.c2-old-protocols.title = Old Protocols
fr.lore.c2-old-protocols.text = The bases keep executing old orders. They do not understand - or refuse to understand - that their creators are gone. Every structure, every turret, every unit is a message from a war that ended for everyone except the machines still fighting it.
fr.lore.c3-betrayal.title = The Betrayal
fr.lore.c3-betrayal.text = Recovered archives reconstruct the first version of the split. According to Cangirus data, one side of the Precursors committed treason. The betrayal shattered the single faction, and the war that followed erased its creators from history.
fr.lore.c4-culprit.title = The Culprit
fr.lore.c4-culprit.text = For the Shards, the picture looks simple: there is a culprit, there is a culprit's legacy, and the expedition's goal is to destroy it. Command marks the operation as a cleanup - the last war of the Precursors will be finished by other hands.
fr.lore.c5-inconsistencies.title = Inconsistencies
fr.lore.c5-inconsistencies.text = Some of the recovered data does not match the treason version. Timestamps are wrong. Fragments reference a project that no Cangirus archive mentions. The analysts flag it and move on - there is a war to finish.
fr.lore.h1-silence.title = Silence
fr.lore.h1-silence.text = Hathor is nearly erased. Ruins and ash - that is everything the moon has left. No active systems, no resistance. Only the remains of structures that died long before the Shards learned to fly.
fr.lore.h2-other-side.title = The Other Side
fr.lore.h2-other-side.text = Among the rubble, the Shards find intact records - written by the other side of the conflict. Not the traitors' story. The accused's story. It paints a completely different picture.
fr.lore.h3-no-betrayal.title = No Betrayal
fr.lore.h3-no-betrayal.text = According to Hathor, there was no treason. One side of the Precursors was trying to prevent a catastrophe. The other kept taking actions that would cause it. What Cangirus calls betrayal, Hathor calls an attempt to save the Precursors.
fr.lore.h4-project.title = The Project
fr.lore.h4-project.text = Technologies that looked like weapons in the Cangirus archives appear here as parts of a single unknown project. Both versions are convincing. Both cannot be true. The expedition no longer knows whose legacy it came to destroy.
fr.lore.r1-dead-world.title = The Dead World
fr.lore.r1-dead-world.text = Cerbero is almost completely dead. No systems survive here to tell the Shards what happened - only ruins, and records so old that most of them crumble at a touch.
fr.lore.r2-before-the-split.title = Before the Split
fr.lore.r2-before-the-split.text = The oldest records do not try to justify anyone. They describe events from before the split itself. Reading them, the Shards realize: the real conflict did not begin with the political fracture of the Precursors.
fr.lore.r3-discovery.title = The Discovery
fr.lore.r3-discovery.text = The Precursors found - or created - something. A technology that became the cause of their division. One part of the Precursors wanted to destroy it. The other was certain it could be controlled. From that disagreement grew the conflict that split a civilization.
fr.lore.r4-weapon.title = The Weapon
fr.lore.r4-weapon.text = After the fighting began, both sides turned their creations against each other. The thing that had caused the war gradually became its weapon. The Precursors disappeared - but their systems received no order to stop.
fr.lore.f1-three-lines.title = Three Lines
fr.lore.f1-three-lines.text = Cangirus speaks of treason. Hathor speaks of salvation. Cerbero speaks of what came before both. The versions contradict each other because each side saw only a part of what happened: one - events up to a certain moment, another - after it, the third - what led to it. Together they restore the true history.
fr.lore.f2-last-enemy.title = The Last Enemy
fr.lore.f2-last-enemy.text = The Precursors are gone. The split is gone. The war they fought ended for everyone except the machines that never received the order to stop. The Shards set out to finish someone else's war - and found a system that still believes it is being fought. The expedition's true goal is not victory. It is silence.
