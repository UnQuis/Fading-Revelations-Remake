block.overdrive-hive.name = Вулик Овердрайву
block.overdrive-hive.description = Вершина технологій овердрайву. Надзвичайно прискорює всі будівлі у величезному радіусі та розганяє всі дружні юніти, що потрапляють у його поле. Підсиліть Нано-Тканиною, щоб розширити обидва радіуси.

fr.stat.overdrivehive = Також розганяє всі дружні юніти в радіусі
