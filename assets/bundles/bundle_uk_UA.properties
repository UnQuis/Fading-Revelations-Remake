#precursor lore
fr.lore.archive.title = Архів Предтеч
fr.lore.recovered = Запис архіву відновлено
fr.lore.recovered-count = Записів
fr.lore.finale-locked = Останні записи відкриються, коли всі планетні архіви буде відновлено.
fr.lore.chain.cangirus = Записи Кангіруса
fr.lore.chain.hathor = Записі Хатор
fr.lore.chain.cerbero = Записі Церебро
fr.lore.chain.finale = Збіжність
block.precursor-terminal.name = Термінал Предтеч
block.precursor-terminal.description = Давній термінал даних Предтеч. Торкання відновлює черговий фрагмент їхніх записів. Усі фрагменти зберігаються в архіві й доступні для повторного читання на будь-якому терміналі.
fr.lore.c1-first-contact.title = Перший контакт
fr.lore.c1-first-contact.text = Експедиція Осколків досягає Кангіруса. Сканери фіксують чинні споруди — автоматизовані бази, що працюють довше, ніж хтось здатен підрахувати. Системи негайно визначають експедицію як ворожу. Якому б протоколу вони не слідували, він старший за нас на тисячоліття.
fr.lore.c2-old-protocols.title = Старі протоколи
fr.lore.c2-old-protocols.text = Бази продовжують виконувати старі накази. Вони не розуміють — або не бажають розуміти, — що їхніх творців більше немає. Кожна споруда, кожна турель, кожен юніт — послання з війни, що закінчилася для всіх, крім машин, які досі її ведуть.
fr.lore.c3-betrayal.title = Зрада
fr.lore.c3-betrayal.text = Відновлені архіви складають першу версію розколу. Згідно з даними Кангіруса, один із боків Предтеч учинив зраду. Саме вона розколола єдину фракцію, а наступна війна стерла творців з історії.
fr.lore.c4-culprit.title = Винуватець
fr.lore.c4-culprit.text = Для Осколків картина виглядає просто: є винуватець, є його спадок, і завдання експедиції — знищити його. Командування позначає операцію як зачистку: останню війну Предтеч буде завершено чужими руками.
fr.lore.c5-inconsistencies.title = Невідповідності
fr.lore.c5-inconsistencies.text = Частина знайдених даних не збігається з версією про зраду. Часові мітки не сходяться. Фрагменти згадують проєкт, про який не говорить жоден архів Кангіруса. Аналітики позначають невідповідності й ідуть далі — війну треба завершити.
fr.lore.h1-silence.title = Тиша
fr.lore.h1-silence.text = Хатор майже стерта. Руїни й попіл — ось усе, що залишилось від луни. Ні чинних систем, ні опору. Тільки остови споруд, що загинули задовго до того, як Осколки навчилися літати.
fr.lore.h2-other-side.title = Інший бік
fr.lore.h2-other-side.text = Серед уламків Осколки знаходять уцілілі записи — вони належать іншому бока конфлікту. Не історія зрадників. Історія обвинувачених. Вона малює зовсім іншу картину.
fr.lore.h3-no-betrayal.title = Не було зради
fr.lore.h3-no-betrayal.text = Згідно з Хатор, зради не було. Один бік Предтеч намагався запобігти катастрофі. Інший продовжував дії, що могли її спричинити. Те, що Кангірус називає зрадою, Хатор називає спробою врятувати Предтеч.
fr.lore.h4-project.title = Проєкт
fr.lore.h4-project.text = Технології, які в архівах Кангіруса виглядали зброєю, тут виявляються частинами єдиного невідомого проєкту. Обидві версії переконливі. Обидві не можуть бути правдою водночас. Експедиція більше не знає, чию спадщину вона прийшла знищувати.
fr.lore.r1-dead-world.title = Мертвий світ
fr.lore.r1-dead-world.text = Церебро практично повністю мертвий. Тут не збереглося систем, здатних розповісти Осколкам про те, що сталося, — тільки руїни й записи настільки старі, що більшість розсипається від дотику.
fr.lore.r2-before-the-split.title = До розколу
fr.lore.r2-before-the-split.text = Найдавніші записи не намагаються виправдати нікого. Вони описують події, що сталися ще до самого розколу. Читаючи їх, Осколки розуміють: справжній конфлікт почався не з політичного розколу Предтеч.
fr.lore.r3-discovery.title = Відкриття
fr.lore.r3-discovery.text = Предтечі виявили — або створили — щось. Технологію, що стала причиною їхнього поділу. Одна частина Предтеч хотіла знищити її. Інша була впевнена, що її можна контролювати. З цієї незгоди виріс конфлікт, що розколов цивілізацію.
fr.lore.r4-weapon.title = Зброя
fr.lore.r4-weapon.text = Після початку протистояння обидві сторони звернули свої творіння одна проти одної. Те, що стало причиною війни, поступово перетворилося на її зброю. Предтечі зникли — але їхні системи так і не отримали наказу зупинитися.
fr.lore.f1-three-lines.title = Три лінії
fr.lore.f1-three-lines.text = Кангірус говорить про зраду. Хатор — про порятунок. Церебро — про те, що було до них. Версії суперечать одна одній, бо кожен бік бачив лише частину того, що сталося: одна — події до певного моменту, інша — після, третя — те, що до нього призвело. Разом вони відновлюють справжню історію.
fr.lore.f2-last-enemy.title = Останній ворог
fr.lore.f2-last-enemy.text = Предтеч більше немає. Розколу більше немає. Війна, яку вони вели, закінчилася для всіх, крім машин, що так і не отримали наказу зупинитися. Осколки вирушили завершити чужу війну — і знайшли систему, яка досі вірить, що війна триває. Справжня мета експедиції — не перемога. Справжня мета — тиша.

