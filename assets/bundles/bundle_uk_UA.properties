block.jump-gate.name = Стрибкові ворота
block.jump-gate.description = Парний телепорт для юнітів. З'єднайте двоє воріт: юніти, що входять у ці ворота, миттєво переміщуються до місця призначення. Кожний зв'язок односторонній — побудуйте зворотний для двосторонніх подорожей. Не переміщує морських юнітів. Потребує енергії.
block.orbital-ring-station.name = Станція орбітального кільця
block.orbital-ring-station.description = Пусковий комплекс проєкту «Орбітальне кільце Кангіруса». Може будуватися лише на Кангірусі. Завантажуйте в нього ресурси, необхідні поточному етапу будівництва — прогрес спільний для всієї планети. Кожен завершений етап добудовує ще один квадрант кільця навколо Кангіруса і дає постійний бонус у кампанії.
status.jump-sickness.name = Фазова втома
status.jump-sickness.description = Цей юніт щойно стрибнув крізь ворота і поки не може стрибнути знову.
