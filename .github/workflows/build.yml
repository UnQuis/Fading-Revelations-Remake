name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['walls/**', 'README.md', '**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      #Shipped campaign maps embed building state inline in the tile RLE stream. If a
      #block's Java class changes shape without the maps being updated, the loader
      #desyncs and crashes with "Index N out of bounds for length N" on sector load.
      #This check verifies every building's stored byte length against what its current
      #class reads, and that the tile RLE covers exactly width*height.
      #scripts/check_maps_live.sh goes further and actually loads every map in a real
      #headless dedicated server; it needs run/server-*.jar, so it is not run here.
      - name: Verify map building serialization
        run: python3 scripts/repair_multicrafter_maps.py
      #Legacy `me-*` names resolve to nothing (a block becomes Blocks.air). Substitution is a
      #judgement call, so this only reports; review the inventory when it changes.
      - name: Report legacy map names
        run: python3 scripts/fix_legacy_map_names.py
      #Mindustry prefixes mod content names with the mod id and looks bundle keys up by the
      #prefixed name, so an unprefixed key is a dead key. This catches that, plus keys that
      #name content which no longer exists.
      - name: Verify bundle keys
        run: python3 scripts/prefix_bundle_keys.py --check
      #etnatic-isles is polished in place rather than generated, so the check
      #rebuilds it from the pristine copy and compares byte for byte. It also
      #asserts the two things only this map can break: every core survives, and
      #no multiblock loses one of its tiles.
      - name: Verify polished campaign maps
        run: python3 scripts/polish_etnatic_isles.py --check
      #jitpack builds tags on demand, so the very first build after a Mindustry release
      #can take several minutes. Warm the cache up front instead of letting Gradle time out.
      - name: Wait for jitpack artifacts
        timeout-minutes: 40
        run: |
          MV=$(grep -E '^mindustryVersion' gradle.properties | sed 's/.*=[[:space:]]*//' | tr -d '[:space:]')
          AV=$(grep -E '^arcVersion' gradle.properties | sed 's/.*=[[:space:]]*//' | tr -d '[:space:]')
          echo "mindustryVersion=$MV arcVersion=$AV"
          if [ -z "$MV" ] || [ -z "$AV" ]; then
            echo "::error::could not resolve versions from gradle.properties"
            exit 1
          fi

          mods="arc-core flabel freetype g3d fx arcnet"
          arc_pom() { curl -s -o /dev/null -w "%{http_code}" "https://jitpack.io/com/github/Anuken/Arc/$1/$AV/$1-$AV.pom"; }
          mind_pom() { curl -s -o /dev/null -w "%{http_code}" "https://jitpack.io/com/github/Anuken/Mindustry/core/$MV/core-$MV.pom"; }

          #the first request is what makes jitpack start building the tag
          for mod in $mods; do arc_pom "$mod" > /dev/null; done
          mind_pom > /dev/null

          ready() {
            for mod in $mods; do
              [ "$(arc_pom "$mod")" = "200" ] || return 1
            done
            [ "$(mind_pom)" = "200" ]
          }
          i=0
          until ready; do
            i=$((i+1))
            if [ $i -gt 60 ]; then
              echo "::warning::jitpack artifacts still missing after 30 min, continuing anyway"
              break
            fi
            echo "waiting for jitpack (attempt $i)..."
            sleep 30
          done
          echo "jitpack status: mindustry/core/$MV=$(mind_pom) arc-core/$AV=$(arc_pom arc-core)"
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FadingRevelations
          path: build/libs/FadingRevelations.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: FadingRevelations
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: FadingRevelations.jar
          generate_release_notes: true
